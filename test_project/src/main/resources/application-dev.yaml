spring:
  datasource:
    url: jdbc:h2:mem:sensorhubdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=KEY,VALUE,DAY
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2

app:
  seed:
    enabled: true
    stations: 200
    measurements-per-station: 5
    raw-samples: 20000
    metric-types: 12
    import-rows: 500
