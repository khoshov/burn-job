version: '3.8'

services:
  neo4j:
    image: neo4j:5.18.0-community
    container_name: neo4j-profiler-db
    ports:
      - "7474:7474" # Neo4j Browser UI
      - "7687:7687" # Bolt Protocol
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data

volumes:
  neo4j_data:
