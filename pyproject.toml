[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "burn-job"
version = "0.1.0"
description = "Performance Optimization Pipeline & Codebase Refactoring Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "kuzu",
    "jinja2",
    "llama-cpp-python",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[project.scripts]
burn-job = "burn_job.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"
